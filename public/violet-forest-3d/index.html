<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violet Forest - 3D Logo</title>
    <link rel="icon" type="image/png" href="/icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000;
        }
        canvas { display: block; }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #8844ff;
            font-family: monospace;
            font-size: 14px;
        }
        #enter-links {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: #8844ff;
            font-family: monospace;
            font-size: 14px;
            white-space: nowrap;
        }
        #enter-links a {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }
        #enter-links a:hover {
            text-decoration: underline;
        }
        #enter-links .divider {
            margin: 0 0.75em;
            opacity: 0.5;
        }
        #spin-hint {
            position: fixed;
            top: 76%;
            left: 50%;
            transform: translateX(-50%);
            color: #8844ff;
            font-family: monospace;
            font-size: 14px;
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>
    <nav id="enter-links">
        <a href="https://portfolio.violetforest.com" target="_top">work</a><span class="divider">|</span><a class="internal" href="/home">personal</a>
    </nav>
    <div id="spin-hint">spin the logo</div>
    <script type="importmap">
    {
        "imports": {
            "three": "./lib/three.module.js",
            "three/addons/": "./lib/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
